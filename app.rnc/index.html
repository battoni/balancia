<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Everything here is behind a login. robots.txt only ASKS a crawler not to fetch; this tag
         tells one that fetched anyway not to keep it, and it is the layer that still holds on a host
         that serves this file without the `X-Robots-Tag` header (`vercel.json`, `.nginx`). Same
         directive as the header — `staticAssets.spec.ts` keeps the two equal. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />

    <!-- Color scheme + tutor tips: set data-theme and data-tutor before paint to
         avoid a flash of the wrong theme / of tip triggers. Mirrors
         src/constants/theme.constant.ts (storage keys),
         src/stores/colorScheme.store.ts (scheme resolution) and
         src/stores/ui.store.ts (tutor resolution). -->
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('app.rnc:color-scheme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = preference === 'dark' || ((!preference || preference === 'system') && prefersDark);
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
          document.documentElement.dataset.tutor =
            localStorage.getItem('app.rnc:tutor-enabled') === '0' ? 'off' : 'on';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.tutor = 'on';
        }
      })();
    </script>

    <!-- The browser chrome follows the page, per scheme, in Balancia's colours (brand/SYSTEM.md):
         teal #0e5a5c on light, the brand's dark ground #0b1416 (`--color-canvas` of
         `styles/theme/themes/balancia.css`) on dark. A bar painted for the wrong scheme is the one
         part of the app the theme cannot reach, and on a phone it is half of what somebody sees
         (from lifeshifter). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0e5a5c">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1416">
    <meta name="msapplication-TileColor" content="#0b1416">

    <!-- Balancia's icon (brand/logo/): the SVG follows the browser's scheme by itself, the ICO is
         the fallback, the PNGs are for the home screen. Absolute paths: a relative one breaks on a
         deep route, where the SPA fallback answers the image request with this HTML. The tile's
         colour (above) is the dark canvas, repeated in favicon/manifest.json and browserconfig.xml
         because none of the three can read a CSS token. Change all three with the theme. -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/icon-192.png">
    <link rel="manifest" href="/favicon/manifest.json">
    <meta name="msapplication-TileImage" content="/favicon/ms-icon-150x150.png">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Neutral until the firm answers (rnc-4 D9): the product's name is `platform.name` from the API,
         written by `useBrandTheme`, and a public page writes its own (`useSeo`). -->
    <title>Carregando…</title>
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
