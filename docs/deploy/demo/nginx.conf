# Balancia demo — one vhost for the platform root and every firm host (docs/deploy/runbook.md).
# The SPA is app.balancia/dist (built off-box: the droplet has 1 GB of RAM); /api and /storage
# are the API on every host, same-origin (rnc-4 D4), so each firm host keeps its own session.
# TLS: certbot --nginx with one certificate naming each host (no wildcard: the DNS panel has no
# API for the DNS-01 challenge). A new firm host: certbot --nginx --expand -d <every host> -d <new>.
server {
    listen 80;
    server_name balancia.battoni.dev *.balancia.battoni.dev;

    root  /var/www/balancia/app.balancia/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 2m;

    access_log /var/log/nginx/balancia-access.log;
    error_log  /var/log/nginx/balancia-error.log;

    # A demo: nothing here should be indexed or trained on. `always` covers error pages too.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/balancia/api.balancia/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/balancia/api.balancia/public;
        # fastcgi_params sets SCRIPT_NAME to the request path (/api/…); Symfony would read that
        # as the base URL and route every call to "/". The front controller is /index.php.
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_pass  unix:/run/php/php8.4-fpm.sock;
    }

    location ^~ /storage/ {
        alias /var/www/balancia/api.balancia/storage/app/public/;
        access_log off;
        expires 7d;
    }

    # An add_header inside a location drops the server-level ones, so they are repeated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ /index.html;   # the SPA's history routes (/painel, /plataforma/…)
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
