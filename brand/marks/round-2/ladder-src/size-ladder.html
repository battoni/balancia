<!doctype html>
<html lang="pt-BR"><meta charset="utf-8">
<title>Escada de tamanhos</title>
<style>
  body {
    margin: 0; padding: 2rem; background: #14120f; color: #ddd5cb;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .3rem; color: #f2ece4; }
  p.lede { color: #9b8f84; margin: 0 0 2rem; font-size: .88rem; }
  .mark { margin-bottom: 2.2rem; }
  .name { font-weight: 600; margin-bottom: .6rem; }
  .row { display: flex; gap: 1.6rem; align-items: flex-end; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell img { image-rendering: pixelated; display: block; }
  .cell .caption { font-size: .72rem; color: #6f665e; margin-top: .35rem; }
  .light { background: #fff; padding: .5rem; border-radius: 6px; }
</style>
<h1>Escada de tamanhos</h1>
<p class="lede">Rasterizado em 96, 32 e 16 pixels reais e ampliado com vizinho-mais-próximo. O que some aqui some no favicon.</p>
<div class="mark">
  <div class="name">balancia-icon-dark</div>
  <div class="row">
    <div class="cell"><img alt="balancia-icon-dark 96px" height="192" src=".ladder/balancia-icon-dark-96.png" width="192"><div class="caption">96px</div></div>
    <div class="cell"><img alt="balancia-icon-dark 32px" height="160" src=".ladder/balancia-icon-dark-32.png" width="160"><div class="caption">32px</div></div>
    <div class="cell"><img alt="balancia-icon-dark 16px" height="128" src=".ladder/balancia-icon-dark-16.png" width="128"><div class="caption">16px</div></div>
  </div>
</div>
<div class="mark">
  <div class="name">balancia-icon</div>
  <div class="row">
    <div class="cell"><img alt="balancia-icon 96px" height="192" src=".ladder/balancia-icon-96.png" width="192"><div class="caption">96px</div></div>
    <div class="cell"><img alt="balancia-icon 32px" height="160" src=".ladder/balancia-icon-32.png" width="160"><div class="caption">32px</div></div>
    <div class="cell"><img alt="balancia-icon 16px" height="128" src=".ladder/balancia-icon-16.png" width="128"><div class="caption">16px</div></div>
  </div>
</div>
</html>
